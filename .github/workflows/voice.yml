name: Make tutor voices

# Turns every line a tutor says into a sound file (Microsoft Edge voices for
# Mio, see content/_app/tutors.json) and saves the files in voice/. Runs when lessons change, once a day (to finish anything a
# daily limit stopped), or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["content/**", "tools/build_voice.py"]
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Most new voice files to make in this run"
        default: "4000"

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install voice tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
      - name: Make missing voice files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCOL_VOICE_MAX: ${{ github.event.inputs.max || '4000' }}
        run: python3 tools/build_voice.py
      - name: Save the voice files
        run: |
          git add -A voice
          if ! git diff --cached --quiet; then
            git config user.name "scol-bot"
            git config user.email "scol-bot@users.noreply.github.com"
            git commit -q -m "Update tutor voices [skip ci]"
            # Sound files cannot be merged: if another run pushed the same file, keep ours (they are the same line).
            for i in 1 2 3 4; do
              git pull -q --rebase -X theirs origin main && git push && break
              echo "push did not go through, trying again ($i)"; sleep 15
            done
          fi
