name: scol
description: A personal AI tutor for children in Classes 1-4.
publish_to: none
version: 1.0.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  http: ^1.2.0
  audioplayers: ^6.0.0
  crypto: ^3.0.3
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/bundle.json
    - assets/sounds/
